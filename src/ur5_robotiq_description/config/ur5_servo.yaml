###############################################
# MoveIt Servo config for UR5 + Robotiq sim
# Uses forward_velocity_controller for smooth,
# latency-free Cartesian velocity streaming.
###############################################

## Input command type
# "speed_units" = commands in m/s and rad/s (what we send from Quest)
command_in_type: "speed_units"

scale:
  # Only used if command_in_type == "unitless"
  linear:     0.6   # m/s
  rotational: 0.3   # rad/s
  joint:      0.5   # rad/s

## Output: joint velocity commands to forward_velocity_controller
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds   # TwistStamped from quest_servo_teleop
joint_command_in_topic:     ~/delta_joint_cmds
joint_topic:                /joint_states
status_topic:               ~/status
command_out_topic:          /forward_velocity_controller/commands

## Publish rate — 250 Hz gives 4 ms servo loop, much smoother than trajectory replanning
publish_period: 0.004   # seconds (250 Hz)
low_latency_mode: false

## Smoothing
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

## MoveIt planning group / frames
move_group_name:         ur_manipulator
planning_frame:          base_link
ee_frame_name:           tool0
robot_link_command_frame: tool0   # twist commands in tool frame

## Stop if no command received for this long
incoming_command_timeout: 0.1   # seconds

## How many zero-velocity messages to send before going silent (halts robot cleanly)
num_outgoing_halt_msgs_to_publish: 4

## Singularity / joint-limit handling
lower_singularity_threshold:  17.0    # condition number — start decelerating
hard_stop_singularity_threshold: 30.0 # condition number — hard stop
joint_limit_margin: 0.1               # radians of margin before limit

## Collision checking
check_collisions: true
collision_check_rate: 10.0            # Hz
collision_check_type: threshold_distance
self_collision_proximity_threshold:  0.01  # m
scene_collision_proximity_threshold: 0.02  # m

## Not using Gazebo
use_gazebo: false

## Planning scene
is_primary_planning_scene_monitor: false
low_pass_filter_coeff: 10.0
